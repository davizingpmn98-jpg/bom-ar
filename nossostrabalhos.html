<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Bom Ar Condicionado - Nossos Trabalhos</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
    body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; margin:0; color:#333; }
    nav { background:#005bb5; padding:15px; text-align:center; }
    nav a { color:#fff; margin: 0 15px; font-weight:bold; text-decoration:none; }
    nav a:hover { text-decoration:underline; }
    section { max-width:1000px; margin: auto; padding:40px 20px; }
    h2 { color:#0077cc; }
    .imagens {
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
        gap: 20px;
        margin-top: 20px;
    }
    .imagens img {
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        object-fit: cover;
        max-height: 300px;
        transition: transform 0.3s ease;
        cursor: pointer;
    }
    .imagens img:hover {
        transform: scale(1.05);
    }
</style>
</head>
<body>

</nav>

    <img src="https://images.unsplash.com/photo-1581091215367-59ab6b63d7a2?auto=format&fit=crop&w=600&q=80" alt="Trabalho 1 - Ar condicionado instalado" />
    <img src="https://images.unsplash.com/photo-1603712725038-e9334c5d8e8b?auto=format&fit=crop&w=600&q=80" alt="Trabalho 2 - Manutenção de ar condicionado" />
    <img src="https://i.imgur.com/0vYrO4X.jpg" alt="Trabalho 3 - Instalação ar condicionado" />
  </div>
</section>
