<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Contato | Bom Ar Condicionado</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f7fb;
}

/* CONTAINER CENTRAL */
.container {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
}

/* CARD */
.card {
  background: #fff;
  width: 100%;
  max-width: 900px;
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

/* BOTÃO VOLTAR */
.voltar {
  display: inline-block;
  margin-bottom: 30px;
  padding: 8px 16px;
  background: #e7f0ff;
  color: #0d5efd;
  text-decoration: none;
  border-radius: 8px;
  font-weight: 600;
}

/* TÍTULO */
.titulo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 28px;
  color: #0d5efd;
  margin-bottom: 10px;
}

/* SUBTÍTULO */
.subtitulo {
  color: #555;
  margin-bottom: 30px;
}

/* CONTATOS */
.contatos {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.contato-item {
  display: flex;
  align-items: center;
  gap: 15px;
  background: #f4f7fb;
  padding: 18px;
  border-radius: 12px;
}

.contato-item span {
  font-size: 22px;
}

.contato-item a {
  text-decoration: none;
  color: #333;
  font-weight: 600;
}

.contato-item p {
  font-size: 14px;
  color: #555;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <a href="index.html" class="voltar">← Início</a>

    <div class="titulo">
      📞 Contato
    </div>

    <p class="subtitulo">
      Entre em contato conosco e solicite um orçamento
    </p>

    <div class="contatos">
      <div class="contato-item">
        📱
        <div>
          <a href="https://wa.me/5511953858402" target="_blank">
            WhatsApp
          </a>
          <p>Atendimento rápido e direto</p>
        </div>
      </div>

      <div class="contato-item">
        📧
        <div>
          <a href="mailto:contato@bomarcondicionado.com">
            Email
          </a>
          <p>contato@bomарcondicionado.com</p>
        </div>
      </div>

      <div class="contato-item">
        📍
        <div>
          <strong>Endereço</strong>
          <p>Atendemos toda a região</p>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
