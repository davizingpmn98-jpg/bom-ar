<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Bom Ar Condicionado</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f8fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            background: #ffffff;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        /* BOTÃO VOLTAR (OPÇÃO 2) */
        .btn-voltar-box {
            display: inline-block;
            background: #e9f1ff;
            color: #0a5fd4;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .btn-voltar-box:hover {
            background: #d6e6ff;
        }

        h1 {
            color: #0a5fd4;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: #0a5fd4;
            color: #fff;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .btn:hover {
            background: #084db0;
        }

        h2 {
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .service {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 25px;
        }

        .icon {
            font-size: 28px;
        }

        .service h3 {
            margin: 0;
            color: #333;
        }

        .service p {
            margin: 5px 0 0;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- BOTÃO VOLTAR PARA A HOME -->
    <a href="index.html" class="btn-voltar-box">⬅ Início</a>

    <h1>❄️ Bom Ar Condicionado</h1>
    <p class="subtitle">Conforto e qualidade para sua casa ou empresa</p>

    <a href="#" class="btn">Solicitar Orçamento</a>

    <h2>Nossos Serviços</h2>

    <div class="service">
        <div class="icon">❄️</div>
        <div>
            <h3>Instalação</h3>
            <p>Instalação segura, rápida e com garantia.</p>
        </div>
    </div>

    <div class="service">
        <div class="icon">🧼</div>
        <div>
            <h3>Higienização</h3>
            <p>Mais saúde, eficiência e qualidade do ar.</p>
        </div>
    </div>

    <div class="service">
        <div class="icon">🛠️</div>
        <div>
            <h3>Manutenção</h3>
            <p>Serviços preventivos e corretivos.</p>
        </div>
    </div>

</div>

</body>
</html>
